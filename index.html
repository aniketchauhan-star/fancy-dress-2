<!DOCTYPE html>
<!--
  ============================================================================
  THE STORY NIGHT  —  interactive 3D flipbook (Neel & the dragon)
  ----------------------------------------------------------------------------
  • No build step, no frameworks. Just open this file in any modern browser.
  • A real 3D hardcover book: it has thickness, a spine, sits angled and casts a
    soft shadow. Tap PLAY to open it (the cover swings on the spine), then flip.
  • Full-bleed picture-book pages: page 1 is a video, pages 2-4 are scenes with
    a speech bubble that pops in once you fully land on the page.
  • Structure is split into THREE files:
        index.html   → this markup
        styles.css   → all styling + the night theme + animations
        script.js    → the flip engine + the page content (EDIT PAGES THERE)
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>The Fancy Dress Competition - 2</title>

<!-- Inline favicon (data URI) — zero network requests, kills the guaranteed
     favicon.ico 404 every browser fires at page load. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E" />

<!-- ── Google Fonts, trimmed to ONLY what visible text renders: Fredoka 600/700
     (headings, THE END, loading bar, rotate notice) + Patrick Hand (body).
     Caveat and Fredoka 500 were requested but nothing rendered them. ── -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Patrick+Hand&display=swap"
  rel="stylesheet"
/>

<!-- All styling lives in styles.css -->
<link rel="stylesheet" href="styles.css" />
</head>

<!-- is-loading from the FIRST paint: the Play button stays hidden behind the
     loading bar until script.js has fetched 100% of the book + game assets. -->
<body class="is-loading">
<!-- Landscape lock: on phones/tablets (touch), the book shows only in landscape.
     In portrait the scene is hidden and this rotate prompt is shown instead. -->
<div class="rotate-notice" id="rotateNotice">
  <div class="rotate-inner">
    <div class="rotate-icon">🔄</div>
    <div class="rotate-text">Please rotate your device<br />to landscape to read</div>
  </div>
</div>
<div class="scene">
  <div class="stage">
    <!-- Fixed 1280×720 book layer. JS scales it (transform) to fit the screen. -->
    <div class="flip-scale" id="flipScale">
    <!-- INNER scale wrapper: the open motion runs here, so it composes with the
         outer responsive scale of .flip-scale. -->
    <div class="book-stage" id="bookStage">
    <!-- Outer hardcover outline — visible once the book is open -->
    <div class="book-frame"></div>
    <div class="floor-shadow"></div>

    <!-- The page-turning book mounts here (JS injects one .leaf per page).
         Sits beneath the 3D cover layer; revealed once the cover swings open.
         .page-stack = the tan fore-edge of the pages still to be turned (right). -->
    <div id="flipbook">
      <div class="page-stack" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <!-- Moving shadow the opening cover casts on the inside page. -->
    <div class="cover-cast"></div>

    <!-- The 3D hardcover + cover-opening animation (own perspective layer). -->
    <div class="cover-scene" id="coverScene">
    <div class="book-float" id="bookFloat">
      <div class="book-pop" id="bookPop">
        <div class="book" id="book">
          <div class="book-inner" id="bookInner">

            <!-- Open-book back cover backing -->
            <div class="book-body"></div>

            <!-- The 3D page block that gives the closed book its thickness -->
            <div class="pageblock">
              <div class="pbf pb-back"></div>
              <div class="pbf pb-left"></div>
              <div class="pbf pb-right"></div>
              <div class="pbf pb-top"></div>
              <div class="pbf pb-bottom"></div>
              <div class="pbf pb-front"></div>
            </div>

            <!-- Front hardcover (last so it stacks in front when closed). -->
            <div class="cover-holder">
            <div class="cover" id="cover">
              <div class="face front">
                <div class="cover-img"></div>
                <div class="back-fill"></div>
                <div class="curl"></div>
                <button class="play-btn" id="hint" type="button" aria-label="Play — open the book"></button>
                <!-- Loading bar shown in the Play button's place until every asset
                     (videos, posters, art, the whole embedded game) is fetched. -->
                <div class="load-bar" id="loadBar" role="progressbar" aria-label="Loading the book"
                     aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                  <div class="load-bar-track"><div class="load-bar-fill" id="loadBarFill"></div></div>
                  <div class="load-bar-text" id="loadBarText">Loading… 0%</div>
                </div>
              </div>
              <!-- BACK of the front cover: intentionally BLANK (plain dark board). -->
              <div class="face back"></div>
            </div>
            </div><!-- /cover-holder -->

          </div>
        </div>
      </div>
    </div>
    </div><!-- /cover-scene -->

    <!-- Flat, top-most, transparent tap zone that only OPENS the book. -->
    <div class="tap-catcher" id="tapCatcher"></div>

    <!-- (THE END is now a real final PAGE — the last leaf, built by script.js:
         a cream "paper" page with "THE END" + a Replay button. Replay closes the
         whole book, reverse of the opening swing, back to the front cover.) -->
    </div><!-- /book-stage -->
    </div><!-- /flip-scale -->
  </div>

  <!-- Progress read-out -->
  <!-- (page counter removed) -->
</div>

<!-- ============================================================================
     NAV CONTROL SET — BACK · NEXT. One set: same box, same weight,
     mirrored placement (see the NAV CONTROL SET block in styles.css).
     Visibility is owned entirely by updateProgress() in script.js, which sets
     BOTH .is-hidden and [disabled] — a dead control is HIDDEN, never greyed.
     ============================================================================ -->

<!-- Flip arrows OUTSIDE the book, fixed at the viewport's bottom corners
     (bottom-left = back, bottom-right = forward). BACK is the SAME svg path as
     NEXT — CSS mirrors it with scaleX(-1). One path, two buttons. -->
<button class="corner-arrow back" id="cornerPrev" type="button" aria-label="Previous page">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="M46 19 L30 5 L30 12 C20 11 11 15 6 30 L12 33 C18 24 22 24 30 24 L30 33 Z" fill="currentColor"/>
  </svg>
</button>
<button class="corner-arrow fwd" id="cornerNext" type="button" aria-label="Next page">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="M46 19 L30 5 L30 12 C20 11 11 15 6 30 L12 33 C18 24 22 24 30 24 L30 33 Z" fill="currentColor"/>
  </svg>
</button>

<!-- BALANCING ACT GAME OVERLAY — a body-level iframe (NOT inside the 3D book,
     so it can expand to a true full-screen box). script.js parks it exactly over
     the page rectangle when the reader lands on the game page, and expands it to
     fullscreen when the game's "Let's Go" button is tapped. The iframe is warmed
     in the BACKGROUND while the reader is still on the cover / early pages, so
     landing on the game page shows it instantly — no loading wait. -->
<div class="lbd-stage" id="lbdStage" aria-hidden="true">
  <iframe id="lbdFrame" title="Balancing Act — weight balancing game"
          allow="autoplay; fullscreen"></iframe>
</div>

<!-- Inlined one-shot SFX (base64) for glitch-free Web Audio playback on file:// -->
<script src="sfx-data.js"></script>
<!-- All behaviour lives in script.js -->
<script src="script.js"></script>
</body>
</html>
